<div class="change-password-container">
    <h2>Change Password</h2>
  
    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" formControlName="currentPassword" />
        <small *ngIf="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched">
          Current password is required (min 6 characters)
        </small>
      </div>
  
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" formControlName="newPassword" />
        <small *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched">
          New password is required (min 6 characters)
        </small>
      </div>
  
      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Changing...' : 'Change Password' }}
      </button>
  
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </div>
