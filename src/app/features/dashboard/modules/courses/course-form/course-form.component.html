<div class="form-container">
    <h2>{{ courseId ? 'Edit Course' : 'Create New Course' }}</h2>
  
    <form [formGroup]="form" (ngSubmit)="submit()" enctype="multipart/form-data">
      <mat-form-field class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <mat-label>Instructor Name</mat-label>
        <input matInput formControlName="instructorName" />
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <mat-label>Contact Link</mat-label>
        <input matInput formControlName="contactLink" />
      </mat-form-field>
  
      <div class="file-input-container">
          <label>Cover Image:</label>
          <input type="file" id="imageCover" (change)="onImageCoverChange($event)" />
          <label for="imageCover" class="custom-file-btn">Choose Cover Image</label>
          <span class="file-names">{{ ImageCoverFile?.name }}</span>
      </div>
  
      <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting">
        {{ courseId ? 'Update' : 'Create' }}
      </button>
      <button mat-button type="button" (click)="cancel()">Cancel</button>
    </form>
  </div>
