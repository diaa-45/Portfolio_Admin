<div class="course-list-container">
    <h2>Courses Management</h2>
  
    <button mat-raised-button color="primary" (click)="createCourse()">
      <mat-icon>add</mat-icon> Create New
    </button>
  
    <mat-progress-spinner *ngIf="loading" diameter="40"></mat-progress-spinner>
  
    <table mat-table [dataSource]="courses" class="mat-elevation-z8" *ngIf="!loading">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let course">{{ course.title }}</td>
      </ng-container>
  
      <ng-container matColumnDef="instructorName">
        <th mat-header-cell *matHeaderCellDef>Instructor</th>
        <td mat-cell *matCellDef="let course">{{ course.instructorName || 'Unknown' }}</td>
      </ng-container>
      
      <ng-container matColumnDef="imageCover">
        <th mat-header-cell *matHeaderCellDef>Cover Image</th>
        <td mat-cell *matCellDef="let course">
          <img [src]="course.imageCover ? 'https://localhost:44383'+ course.imageCover : '/defualt-article.png'" alt="Course Cover" width="100" />
        </td>
      </ng-container>
  
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let course">
          <button mat-icon-button color="primary" (click)="editCourse(course.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="accent" [routerLink]="['/dashboard/courses', course.id]">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCourse(course.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
