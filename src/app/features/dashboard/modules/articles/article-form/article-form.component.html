<div class="project-form-container">
    <h2>{{ articleId ? 'Edit Article' : 'Create New Article' }}</h2>
  
    <form [formGroup]="form" (ngSubmit)="submit()" enctype="multipart/form-data">
      <mat-form-field class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <mat-label>Content</mat-label>
        <textarea matInput formControlName="content"></textarea>
      </mat-form-field>
  
  
      <div class="file-input-container">
          <label>Main Image:</label>
          <input type="file" id="mainImage" (change)="onMainImageChange($event)" />
          <label for="mainImage" class="custom-file-btn">Choose Main Image</label>
          <span class="file-names">{{ mainImageFile?.name }}</span>
      </div>
      
      <div class="file-input-container">
          <label>Thumbnail Image:</label>
          <input type="file" id="thumbImage" (change)="onThumbImageChange($event)" />
          <label for="thumbImage" class="custom-file-btn">Choose Thumbnail Image</label>
          <span class="file-names">{{ thumbImageFile?.name }}</span>
      </div>
      
      <mat-form-field class="full-width">
        <mat-label>Author Name</mat-label>
        <input matInput formControlName="author" />
      </mat-form-field>
  
      <button mat-raised-button color="primary" type="submit">
        {{ articleId ? 'Update' : 'Create' }}
      </button>
      <button mat-button type="button" (click)="cancel()">Cancel</button>
    </form>
  </div>
