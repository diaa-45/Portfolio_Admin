<div class="project-details-container" *ngIf="project">
  <h2>{{ project.title }}</h2>
  <p>{{ project.description }}</p>

  <div class="cover-image">
    <h4>Cover Image</h4>
    <img [src]="project.imageCover ? 'https://myportfolio-api.runasp.net'+ project.imageCover : 'default.png'" alt="{{ project.title }}" />
  </div>
  <input type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" style="display: none;" />
  <button mat-raised-button color="primary"style="background-color: #1976d2;" (click)="fileInput.click()">
    <mat-icon>cloud_upload</mat-icon>
    Upload Image
  </button>
  <div class="tour-images" *ngIf="project.images?.length">
    <div class="upload-section">
      <h4>Tour Images</h4>
      
    </div>
    <div class="images-grid">
      <div class="image-wrapper" *ngFor="let img of project.images; let i = index">
        <button mat-icon-button class="delete-btn" (click)="deleteImage(img)" aria-label="Delete image">
          X
        </button>
        <img [src]="'https://myportfolio-api.runasp.net' + img.imageUrl" alt="{{ project.title }}" />
      </div>
    </div>
  </div>

  <p class="demo-link-container">
    <strong>Demo Link:</strong>
    <a [href]="project.demoLink" target="_blank" class="demo-link">{{ project.demoLink }}</a>
  </p>

  <button mat-raised-button color="primary" (click)="back()">
    <mat-icon>arrow_back</mat-icon>
    Back to Projects
  </button>

  
</div>
