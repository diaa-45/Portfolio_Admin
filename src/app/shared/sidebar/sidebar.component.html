<!-- Toggle Button for Mobile -->
<button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-label]="sidebarOpen ? 'Close sidebar' : 'Open sidebar'">
  <i class="fas fa-bars"></i>
</button>

<nav class="sidebar" [class.active]="sidebarOpen">
  <div class="sidebar-header">
    <img src="/logo.jpg" alt="Logo" class="logo" />
    <h4>Eng Diaa Dashboard</h4>
    
  </div>
  <ul class="sidebar-menu">
    <li><a routerLink="/dashboard/projects" (click)="closeSidebarOnMobile()"><i class="fas fa-folder"></i> Projects</a></li>
    <li><a routerLink="/dashboard/articles" (click)="closeSidebarOnMobile()"><i class="fas fa-file-alt"></i> Articles</a></li>
    <li><a routerLink="/dashboard/courses" (click)="closeSidebarOnMobile()"><i class="fas fa-graduation-cap"></i> Courses</a></li>
    <li><a routerLink="/dashboard/about" (click)="closeSidebarOnMobile()"><i class="fas fa-info-circle"></i> About</a></li>
    <li><a routerLink="/dashboard/change-password" (click)="closeSidebarOnMobile()"><i class="fas fa-cog"></i> Settings</a></li>
    <div class="header-actions">
      <button class="notification-btn" 
              [routerLink]="['/dashboard/notification']" 
              (click)="closeSidebarOnMobile()"
              aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span *ngIf="unreadCount > 0" class="notification-count">
          {{ unreadCount }}
        </span>
      </button>
  
      <button class="logout-btn" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span class="logout-text">Logout</span>
      </button>
    </div>
  </ul>
</nav>
